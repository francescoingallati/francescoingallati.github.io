  <section class="contatti">
    <h1>Contattami</h1>
    <p class="contatti-intro">Hai un progetto o un'opportunità di cui parlare? Scrivimi, ti risponderò al più presto.
    </p>

    <form class="form-contatti">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="campo">
        <label for="messaggio">Messaggio</label>
        <textarea id="messaggio" name="messaggio" rows="6" required></textarea>
      </div>

      <button type="submit" class="btn-invia">Invia messaggio</button>
    </form>
  </section>
