    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg sticky-top" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Francesco Ingallati</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu"
        aria-expanded="false" aria-label="Apri il menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="cv.html">CV</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="contatti.html">Contatti</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>

    <section class="contatti">
      <h1>Contattami</h1>
      <p class="contatti-intro">Pensi che possa essere la persona giusta per collaborare con il tuo team? Scrivimi, ti
        risponderò al più presto.
      </p>

      <form class="form-contatti" id="form-contatti">
        <div class="mb-3">
          <label for="nome" class="form-label">Nome</label>
          <input type="text" class="form-control" id="nome" name="nome" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="mb-3">
          <label for="messaggio" class="form-label">Messaggio</label>
          <textarea class="form-control" id="messaggio" name="messaggio" rows="6" required></textarea>
        </div>

        <button type="submit" class="btn btn-ambra btn-invia w-100">Invia messaggio</button>
      </form>
      <p class="form-esito" id="form-esito" role="status" aria-live="polite"></p>
    </section>

  </main>

  <footer>
    <p>Francesco Ingallati - verso AI engineer</p>
    <div class="footer-social">
      <a href="https://github.com/francescoingallati" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/francesco-ingallati-532352256/" target="_blank" rel="noopener">LinkedIn</a>
    </div>
    <p class="footer-copy">© 2026 Francesco Ingallati</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    emailjs.init("gsMJXYAQmPN2FD7py");

    const form = document.getElementById("form-contatti");
    const esito = document.getElementById("form-esito");

    form.addEventListener("submit", function (event) {
      event.preventDefault();


      const bottone = form.querySelector(".btn-invia");
      bottone.disabled = true;
      bottone.textContent = "Invio in corso...";

      emailjs.sendForm("service_nshqcss", "template_137ix4a", form)
        .then(function () {
          esito.textContent = "Messaggio inviato! Ti risponderò al più presto.";
          esito.className = "form-esito successo";
          form.reset();
          bottone.disabled = false;
          bottone.textContent = "Invia messaggio";
        })
        .catch(function (error) {
          esito.textContent = "Si è verificato un errore. Riprova o scrivimi via email.";
          esito.className = "form-esito errore";
          console.error(error);
          bottone.disabled = false;
          bottone.textContent = "Invia messaggio";
        });
    });
  </script>
</body>

</html>
